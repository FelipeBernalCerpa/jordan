<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jordan — Voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070C; --panel:#0E1017; --panel2:#13151F; --line:#1F2230;
    --ink:#F3F4F8; --ink2:#9298AC; --ink3:#5C6177; --hub:#7AA2F7; --green:#34D399;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; max-width:460px; margin:0 auto}
  .head{font-family:'Space Grotesk',system-ui,sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  a{color:var(--ink2); text-decoration:none; font-size:12px}

  header{padding:20px 20px 10px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line)}
  header .title{font-size:15.5px; font-weight:600}
  header .status{font-size:10.5px; color:var(--green); display:flex; align-items:center; gap:5px}
  header .dot{width:5px; height:5px; border-radius:50%; background:var(--green)}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:0 20px; overflow-y:auto}

  .orb-wrap{position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .ring{position:absolute; width:100%; height:100%; border-radius:50%; border:1.5px solid var(--hub); opacity:0; }
  .ring.active{animation:ring 2.4s cubic-bezier(.3,.6,.4,1) infinite}
  @keyframes ring{0%{transform:scale(.88); opacity:.5}100%{transform:scale(1.55); opacity:0}}
  .core{width:106px; height:106px; border-radius:50%; background:var(--panel); border:1.5px solid var(--hub); display:flex; align-items:center; justify-content:center; transition:box-shadow .3s}
  .core.active{box-shadow:0 0 22px -2px var(--hub)}

  #state{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink2); letter-spacing:.04em}

  .transcript{width:100%; display:flex; flex-direction:column; gap:8px; max-height:40vh; overflow-y:auto}
  .bubble{max-width:82%; padding:10px 14px; border-radius:16px; font-size:13px; line-height:1.4}
  .user{align-self:flex-end; background:var(--panel2); border:1px solid var(--line); border-radius:16px 16px 4px 16px}
  .jordan{align-self:flex-start; background:var(--hub); color:#06070C; font-weight:500; border-radius:16px 16px 16px 4px; white-space:pre-wrap}

  footer{padding:18px 20px 28px; display:flex; flex-direction:column; align-items:center; gap:10px; border-top:1px solid var(--line)}
  #mic{width:64px; height:64px; border-radius:50%; border:none; background:var(--hub); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px -4px var(--hub)}
  #mic.listening{background:#F87171; box-shadow:0 0 18px -4px #F87171}
  #hint{font-size:11.5px; color:var(--ink3)}
  #unsupported{display:none; color:#F87171; font-size:12.5px; text-align:center; max-width:320px}
</style>
</head>
<body>
  <header>
    <div style="flex:1">
      <div class="head title">Jordan</div>
      <div class="status"><span class="dot"></span>MODO VOZ</div>
    </div>
    <a href="/">← chat</a>
  </header>

  <main>
    <div class="orb-wrap">
      <div class="ring" id="ring1"></div>
      <div class="ring" id="ring2" style="animation-delay:.8s"></div>
      <div class="core" id="core"><span class="head" style="color:var(--hub); font-size:26px; font-weight:600">J</span></div>
    </div>
    <div id="state" class="mono">Toca el micrófono para hablar</div>
    <div class="transcript" id="transcript"></div>
    <div id="unsupported">
      Tu navegador no soporta reconocimiento de voz nativo (funciona en Chrome de escritorio/Android). Usa el chat de texto por ahora.
    </div>
  </main>

  <footer>
    <button id="mic" aria-label="Hablar con Jordan">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="9" y="3" width="6" height="11" rx="3" stroke="#06070C" stroke-width="2"/><path d="M5 11a7 7 0 0014 0M12 18v3" stroke="#06070C" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="hint">Toca y habla. Jordan te responde en voz.</div>
  </footer>

  <script src="/voice.js"></script>
</body>
</html>
