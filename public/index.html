<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jordan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070C; --panel:#0E1017; --panel2:#13151F; --line:#1F2230;
    --ink:#F3F4F8; --ink2:#9298AC; --ink3:#5C6177;
    --green:#34D399; --hub:#7AA2F7;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; height:100vh; display:flex; flex-direction:column}
  .head{font-family:'Space Grotesk',system-ui,sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}

  header{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
  header .dot{width:6px; height:6px; border-radius:50%; background:var(--green)}
  header .title{font-size:15px; font-weight:600}
  header .status{font-size:11px; color:var(--green)}

  #log{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px}
  .bubble{max-width:70%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.45}
  .user{align-self:flex-end; background:var(--panel2); border:1px solid var(--line); border-radius:16px 16px 4px 16px}
  .jordan{align-self:flex-start; background:var(--hub); color:#06070C; font-weight:500; border-radius:16px 16px 16px 4px; white-space:pre-wrap}
  .pending{align-self:flex-start; color:var(--ink3); font-size:12px}

  form{display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line)}
  input{flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:13px 16px; color:var(--ink); font-size:13.5px}
  input:focus{outline:none; border-color:var(--hub)}
  button{border:none; background:var(--hub); color:#06070C; font-weight:600; border-radius:14px; padding:0 20px; font-size:13.5px; cursor:pointer}
  button:disabled{opacity:.5; cursor:default}
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <div>
      <div class="head title">Jordan</div>
      <div class="mono status">CONECTADO</div>
    </div>
  </header>

  <div id="log"></div>

  <form id="form">
    <input id="input" placeholder="Escríbele a Jordan…" autocomplete="off" />
    <button id="send" type="submit">Enviar</button>
  </form>

  <script src="/app.js"></script>
</body>
</html>
