<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jordan — Conexiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070C; --panel:#0E1017; --panel2:#13151F; --line:#1F2230;
    --ink:#F3F4F8; --ink2:#9298AC; --ink3:#5C6177; --hub:#7AA2F7; --green:#34D399;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh}
  .head{font-family:'Space Grotesk',system-ui,sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  a{color:var(--hub); text-decoration:none}
  .wrap{max-width:560px; margin:0 auto; padding:28px 20px 60px}
  .back{font-size:12px; color:var(--ink2)}
  h1{font-size:19px; margin:10px 0 4px}
  p.sub{color:var(--ink2); font-size:13px; margin:0 0 24px}

  section{margin-bottom:26px}
  h2{font-size:13px; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px}

  .cuenta{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center}
  .cuenta .email{font-size:13.5px; font-weight:600}
  .cuenta .label{font-size:11px; color:var(--ink2)}
  .cuenta .green{color:var(--green); font-size:11px}

  form{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
  label{font-size:11.5px; color:var(--ink2)}
  input{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font-size:13.5px}
  button{border:none; background:var(--hub); color:#06070C; font-weight:600; border-radius:10px; padding:11px; font-size:13px; cursor:pointer}

  .app{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:8px; color:var(--ink3); font-size:12.5px}
  #empty{color:var(--ink3); font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Jordan</a>
    <h1 class="head">Conexiones</h1>
    <p class="sub">Cuentas y apps a las que Jordan tiene acceso real.</p>

    <section>
      <h2>Google</h2>
      <div id="cuentas"></div>
      <div id="empty" style="display:none">Todavía no hay ninguna cuenta de Google conectada.</div>

      <form id="form" style="margin-top:14px">
        <label>Apodo para la cuenta que vas a conectar (opcional — ej. "personal", "negocio")</label>
        <input id="label" placeholder="negocio" />
        <button type="submit">Conectar otra cuenta de Google</button>
      </form>
    </section>

    <section>
      <h2>Tus apps (Synaris)</h2>
      <div class="app">Ascend, Midas y la interfaz de Synaris — pendientes de conectar. Dile a Jordan en el chat qué quieres que haga con ellas para definir cómo.</div>
    </section>
  </div>

  <script src="/connections.js"></script>
</body>
</html>
