<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jordan — Base de conocimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070C; --panel:#0E1017; --panel2:#13151F; --line:#1F2230;
    --ink:#F3F4F8; --ink2:#9298AC; --ink3:#5C6177; --hub:#7AA2F7; --red:#F87171;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh}
  .head{font-family:'Space Grotesk',system-ui,sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  a{color:var(--hub); text-decoration:none}

  .wrap{max-width:640px; margin:0 auto; padding:28px 20px 60px}
  header{display:flex; align-items:center; gap:10px; margin-bottom:24px}
  header .back{font-size:12px; color:var(--ink2)}
  h1{font-size:19px; margin:0}
  p.sub{color:var(--ink2); font-size:13px; margin:4px 0 0}

  form{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; margin-bottom:28px}
  label{font-size:11.5px; color:var(--ink2); margin-bottom:-4px}
  input, textarea{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font-size:13.5px; font-family:inherit; resize:vertical}
  textarea{min-height:90px}
  button{align-self:flex-end; border:none; background:var(--hub); color:#06070C; font-weight:600; border-radius:10px; padding:10px 18px; font-size:13px; cursor:pointer}

  .item{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; gap:12px}
  .item .title{font-weight:600; font-size:13.5px}
  .item .content{color:var(--ink2); font-size:12.5px; margin-top:4px; line-height:1.4}
  .item .meta{color:var(--ink3); font-size:10.5px; margin-top:6px}
  .item button{background:transparent; color:var(--red); align-self:flex-start; padding:4px 8px; font-size:11px}
  #empty{color:var(--ink3); font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <a class="back" href="/">← Jordan</a>
        <h1 class="head">Base de conocimiento</h1>
        <p class="sub">Lo que agregues acá, Jordan lo consulta como referencia antes de responder.</p>
      </div>
    </header>

    <form id="form">
      <label>Título</label>
      <input id="title" placeholder="Ej: Precios de los planes de Synaris" required />
      <label>Contenido</label>
      <textarea id="content" placeholder="El contenido real que Jordan debe recordar…" required></textarea>
      <button type="submit">Agregar</button>
    </form>

    <div id="list"></div>
    <div id="empty" style="display:none">Todavía no hay nada acá. Agrega lo primero arriba.</div>
  </div>

  <script src="/knowledge.js"></script>
</body>
</html>
